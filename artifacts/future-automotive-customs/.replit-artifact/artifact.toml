kind = "web"
previewPath = "/"
title = "Future Automotive Customs"
description = "A cinematic showcase website for Future Automotive Customs, featuring its custom automotive work, services, process, and Instagram-led gallery."
version = "1.0.0"
id = "artifacts/future-automotive-customs"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20505

[services.development]
run = "pnpm --filter @workspace/future-automotive-customs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/future-automotive-customs", "run", "build" ]
serve = "static"
publicDir = "artifacts/future-automotive-customs/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20505"
BASE_PATH = "/"
